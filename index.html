                          "{t.review}"
                        </p>
                      </div>

                      <div className="mt-6 pt-4 border-t border-stone-200">
                        <p className="font-serif font-bold text-teal-900 text-base">{t.name}</p>
                        <p className="text-xs text-slate-500 font-medium mt-0.5">{t.treatment}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* Timings Section */}
            <section id="timing" className="py-16 sm:py-20 bg-stone-50 border-b border-stone-200">
              <div className="max-w-5xl mx-auto px-4 sm:px-6">
                <div className="text-center max-w-2xl mx-auto mb-12">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-100 px-3 py-1 rounded-full border border-teal-200">
                    Clinic Working Hours
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900">Weekly Open & Close Schedule</h2>
                  <p className="mt-2 text-sm text-slate-600">Open 7 days a week for scheduled consultations, post-op reviews, and immediate toothache relief.</p>
                </div>

                <div className="grid md:grid-cols-3 gap-6">
                  {WEEKLY_SCHEDULE.map((item, idx) => (
                    <div key={idx} className="rounded-3xl border border-teal-100 bg-white p-6 shadow-sm hover:shadow-md transition">
                      <div className="inline-flex items-center gap-2 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full mb-3">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Open
                      </div>
                      <h3 className="font-serif text-xl font-bold text-slate-900">{item.days}</h3>
                      <p className="mt-2 text-lg font-extrabold text-teal-700">{item.hours}</p>
                      <p className="mt-3 text-xs text-slate-500 leading-relaxed pt-3 border-t border-stone-100">{item.status}</p>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* Doctor Section */}
            <section id="doctor" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-24 border-b border-stone-200">
              <div className="grid items-center gap-10 lg:grid-cols-2">
                <div className="overflow-hidden rounded-[2rem] shadow-xl border-4 border-white bg-slate-100">
                  <img
                    src="https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1000&q=80"
                    alt="Doctor consultation suite"
                    className="h-96 w-full object-cover transition duration-500 hover:scale-105"
                  />
                </div>
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                    Lead Clinical Specialist
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Meet {config.doctorName}</h2>
                  <p className="mt-2 font-semibold text-teal-700">{config.doctorDesignation}</p>
                  <p className="mt-4 text-slate-600 text-sm sm:text-base leading-relaxed">{config.doctorBio}</p>
                </div>
              </div>
            </section>

            {/* Appointment Form */}
            <section id="appointment" className="py-16 sm:py-24 bg-stone-50 border-b border-stone-200">
              <div className="max-w-3xl mx-auto px-4 sm:px-6">
                <div className="rounded-3xl bg-white p-8 sm:p-12 shadow-xl border border-teal-100">
                  <div className="text-center max-w-xl mx-auto mb-8">
                    <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                      Online Reservation
                    </span>
                    <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900">Book Your Dental Visit</h2>
                    <p className="mt-2 text-xs sm:text-sm text-slate-500">
                      Choose your preferred date, slot, and procedure.
                    </p>
                  </div>

                  {bookedNotice && (
                    <div className="mb-8 rounded-2xl bg-emerald-50 border border-emerald-200 p-5 text-emerald-900">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-bold bg-emerald-200 text-emerald-900 px-2.5 py-0.5 rounded">
                          Token: {bookedNotice.token}
                        </span>
                        <span className="text-xs font-bold text-emerald-700">✓ Booking Confirmed</span>
                      </div>
                      <p className="text-sm font-bold">Appointment scheduled for {bookedNotice.name}!</p>
                      <p className="text-xs text-emerald-800 mt-1">
                        Procedure: <strong>{bookedNotice.service}</strong> on <strong>{bookedNotice.date} at {bookedNotice.time}</strong>.
                      </p>
                    </div>
                  )}

                  <form onSubmit={handleBookAppointment} className="grid grid-cols-1 sm:grid-cols-2 gap-5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Patient Full Name *
                      </label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Ramesh Kumar"
                        value={appointmentForm.name}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, name: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Contact Phone Number *
                      </label>
                      <input 
                        type="tel" 
                        required 
                        placeholder="e.g. 7782962661"
                        value={appointmentForm.phone}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, phone: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Treatment / Concern
                      </label>
                      <select 
                        value={appointmentForm.service}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, service: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      >
                        {TREATMENTS.map((t) => (
                          <option key={t.id} value={t.title}>{t.title}</option>
                        ))}
                        <option value="General Checkup & Teeth Examination">General Checkup & Teeth Examination</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Preferred Date *
                      </label>
                      <input 
                        type="date" 
                        required 
                        value={appointmentForm.date}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, date: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Preferred Time Slot
                      </label>
                      <select 
                        value={appointmentForm.time}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, time: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      >
                        <option>09:30 AM</option>
                        <option>11:00 AM</option>
                        <option>01:30 PM</option>
                        <option>04:00 PM</option>
                        <option>06:30 PM</option>
                        <option>08:30 PM</option>
                      </select>
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Symptoms or Requests (Optional)
                      </label>
                      <textarea 
                        rows={2}
                        placeholder="e.g. Sensitivity to cold water on upper right molar."
                        value={appointmentForm.notes}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, notes: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div className="sm:col-span-2 pt-2">
                      <button 
                        type="submit" 
                        className="w-full py-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md transition hover:shadow-lg"
                      >
                        Confirm Dental Appointment
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </section>

            {/* Direct Google Maps Navigation */}
            <section id="contact" className="border-t border-teal-100 bg-white py-16 lg:py-24">
              <div className="mx-auto max-w-7xl px-4 sm:px-6">
                <div className="text-center max-w-2xl mx-auto mb-12">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                    Location & Directions
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Visit Dentel clinic</h2>
                  <p className="mt-2 text-slate-600 text-sm">Located on KTG College Road, Hegganahalli, Bengaluru.</p>
                </div>

                <div className="grid gap-8 lg:grid-cols-3">
                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">📞</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Direct Helpline</h3>
                      <p className="mt-2 text-slate-600 text-sm">Call for appointment confirmations and emergencies:</p>
                      <p className="mt-2 text-lg font-bold text-teal-800">{config.phone}</p>
                    </div>
                    <a href={"tel:" + config.phone} className="mt-5 inline-block text-xs font-bold text-teal-700 hover:underline">
                      Call Desk Now →
                    </a>
                  </div>

                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">📍</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Physical Address</h3>
                      <p className="mt-2 text-slate-600 text-sm leading-relaxed">{config.address}</p>
                    </div>
                    <a 
                      href={config.mapUrl} 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      className="mt-5 inline-flex items-center gap-2 rounded-xl bg-teal-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-teal-700 transition shadow-sm w-fit"
                    >
                      🗺️ Open in Google Maps
                    </a>
                  </div>

                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">🕒</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Weekly Timings</h3>
                      <div className="mt-2 space-y-1 text-xs text-slate-600">
                        <p><strong>Mon – Sat:</strong> 9:00 AM – 10:00 PM</p>
                        <p><strong>Sunday:</strong> 9:00 AM – 9:00 PM</p>
                      </div>
                    </div>
                    <a href="#timing" className="mt-5 inline-block text-xs font-bold text-teal-700 hover:underline">
                      View full schedule details →
                    </a>
                  </div>
                </div>

                <div className="mt-12 rounded-3xl bg-slate-900 text-white p-8 sm:p-10 flex flex-col md:flex-row items-center justify-between gap-6">
                  <div>
                    <h3 className="font-serif text-2xl font-bold text-white">Need Turn-by-Turn GPS Directions?</h3>
                    <p className="mt-1 text-sm text-slate-300 max-w-xl">
                      Click below to launch Google Maps directly for real-time traffic and routing to Siddeshwara Medicals, KTG College Rd, Hegganahalli.
                    </p>
                  </div>
                  <a
                    href={config.mapUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="shrink-0 rounded-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-7 py-3.5 text-sm transition shadow-lg flex items-center gap-2"
                  >
                    <span>📍 Get Google Maps Route</span>
                  </a>
                </div>
              </div>
            </section>
          </main>

          <footer className="bg-teal-900 py-10 text-center text-teal-100 text-xs border-t border-teal-800">
            <p className="font-bold text-base text-white font-serif">{config.clinicName}</p>
            <p className="mt-2 max-w-md mx-auto">{config.address}</p>
            <p className="mt-2">Helpline: {config.phone} • Mon–Sat: 9 AM–10 PM | Sun: 9 AM–9 PM</p>
            <p className="mt-6 text-teal-400">© 2026 {config.clinicName}. All rights reserved.</p>
          </footer>

          {lightbox !== null && GALLERY_IMAGES[lightbox] && (
            <div 
              className="fixed inset-0 z-50 grid place-items-center bg-black/90 p-4 backdrop-blur-sm" 
              onClick={() => setLightbox(null)}
            >
              <div 
                className="relative max-h-[90vh] w-full max-w-4xl overflow-hidden rounded-3xl bg-white shadow-2xl" 
                onClick={(e) => e.stopPropagation()}
              >
                <img 
                  src={GALLERY_IMAGES[lightbox].img} 
                  alt={GALLERY_IMAGES[lightbox].title} 
                  className="max-h-[75vh] w-full object-cover" 
                />
                <div className="p-4 bg-white flex justify-between items-center">
                  <p className="font-serif text-lg font-bold text-teal-900">{GALLERY_IMAGES[lightbox].title}</p>
                  <button 
                    onClick={() => setLightbox(null)} 
                    className="rounded-full bg-stone-100 hover:bg-stone-200 text-slate-700 w-8 h-8 flex items-center justify-center font-bold text-sm transition"
                  >
                    ✕
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
